name: 发布桌面安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            rust_target: ""
            target_args: ""
            warp_platform: windows
            warp_arch: amd64
          - name: macOS Apple Silicon
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            target_args: --target aarch64-apple-darwin
            warp_platform: macos
            warp_arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            target_args: --target x86_64-apple-darwin
            warp_platform: macos
            warp_arch: amd64

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 启用 pnpm
        run: corepack enable

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 准备 WARP 内核（Windows）
        if: matrix.warp_platform == 'windows'
        shell: pwsh
        run: ./tools/prepare-warp.ps1

      - name: 准备 WARP 内核（macOS）
        if: matrix.warp_platform == 'macos'
        run: bash ./tools/prepare-warp.sh "${{ matrix.warp_arch }}"

      - name: 安装前端依赖
        run: corepack pnpm install --frozen-lockfile

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Codex State Kit v__VERSION__
          releaseBody: |
            Codex State Kit v__VERSION__

            下载对应系统的安装包即可。Mac 版本当前为未公证构建；首次打开时请按系统提示允许应用运行。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target_args }}
          retryAttempts: 2
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][setup].[ext]"
