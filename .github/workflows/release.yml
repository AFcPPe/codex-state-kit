name: 发布桌面安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notes:
        description: "发布说明。留空则使用标签附注，再没有则用默认文案"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            rust_target: ""
            target_args: ""
            warp_platform: windows
            warp_arch: amd64
          - name: macOS Apple Silicon
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            target_args: --target aarch64-apple-darwin
            warp_platform: macos
            warp_arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            target_args: --target x86_64-apple-darwin
            warp_platform: macos
            warp_arch: amd64

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取发布说明
        id: notes
        shell: bash
        env:
          MANUAL_NOTES: ${{ github.event.inputs.notes }}
        run: |
          default='下载对应系统的安装包即可。Mac 版本当前为未公证构建；首次打开时请按系统提示允许应用运行。'
          notes="${MANUAL_NOTES:-}"
          if [ -z "$notes" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            notes="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          fi
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="$default"
          fi
          delim="NOTES_${RANDOM}_${RANDOM}"
          {
            echo "body<<${delim}"
            printf '%s\n' "$notes"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 准备 WARP 内核（Windows）
        if: matrix.warp_platform == 'windows'
        shell: pwsh
        run: ./tools/prepare-warp.ps1

      - name: 准备 WARP 内核（macOS）
        if: matrix.warp_platform == 'macos'
        run: bash ./tools/prepare-warp.sh "${{ matrix.warp_arch }}"

      - name: 安装前端依赖
        run: corepack pnpm install --frozen-lockfile

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Codex State Kit v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target_args }}
          retryAttempts: 2
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][setup].[ext]"
